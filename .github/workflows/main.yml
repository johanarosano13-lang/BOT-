name: EMA alerts

on:
  schedule:
    - cron: "5 * * * *"   # cada hora, minuto 5
  workflow_dispatch:       # correrlo a mano (manda un mensaje de prueba primero)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - name: Probar Telegram (solo en corrida manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ema_alert_bot.py --test
      - name: Correr bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ema_alert_bot.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          if [ -f alert_state.json ]; then git add alert_state.json; fi
          git diff --cached --quiet || (git commit -m "update state" && git push)
